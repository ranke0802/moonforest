# Temporary build check for branch claude/v03-fixed-layouts only: builds 0.2 and
# 0.3 from source exactly like the Pages job and runs the same tests. It has no
# Pages permission or deploy job, so it cannot publish.
name: Build check (no deploy)
on:
  push:
    branches: ['claude/v03-fixed-layouts']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without asset preparation
        run: npm ci --prefix ArcherPreview --ignore-scripts --no-audit --no-fund
      - name: Build MoonForest 0.2 and 0.3 from source
        run: node ArcherPreview/scripts/ci-build-releases.mjs
        env:
          MOONFOREST_RELEASE_CI: '1'
      - name: Verify source and release contracts without repacking assets
        run: node --test --test-concurrency=2 ArcherPreview/tests/release-route.test.js ArcherPreview/tests/v03-save-slots.test.js ArcherPreview/tests/v03-shell.test.js ArcherPreview/tests/v03-i18n.test.js ArcherPreview/tests/v03-vitality.test.js ArcherPreview/tests/adaptive-performance.test.js ArcherPreview/tests/v04-sky-clock.test.js ArcherPreview/tests/v04-cluster-decimate.test.js ArcherPreview/tests/v04-detail-lod.test.js ArcherPreview/tests/v04-meadow-scatter.test.js ArcherPreview/tests/v04-lod-coverage.test.js ArcherPreview/tests/v03-title-camera.test.js ArcherPreview/tests/monster-group-scheduler.test.js ArcherPreview/tests/meshopt-worker-supervisor.test.js ArcherPreview/tests/village-active-candidates.test.js ArcherPreview/tests/village-active-candidates-registry.test.js ArcherPreview/tests/navigation.test.js ArcherPreview/tests/large-actor-navigation.test.js ArcherPreview/tests/map-navigation-cache.test.js ArcherPreview/tests/chapter-quest.test.js ArcherPreview/tests/progress-save-recovery.test.js ArcherPreview/tests/gold-loot.test.js ArcherPreview/tests/context-recovery.test.js ArcherPreview/tests/source-provenance.test.js ArcherPreview/tests/release-deployment.test.js ArcherPreview/tests/stage-pages.test.js ArcherPreview/tests/navigation-search-workspace.test.js ArcherPreview/tests/village-texture-demand-cache.test.js ArcherPreview/tests/map-shader-budget.test.js ArcherPreview/tests/actor-camera-culling.test.js ArcherPreview/tests/frame-work-coordinator.test.js ArcherPreview/tests/authored-route-grids.test.js ArcherPreview/tests/quality-restore-settings.test.js ArcherPreview/tests/scheduler-prewarm.test.js ArcherPreview/tests/long-frame-recording-carry.test.js ArcherPreview/tests/player-mesh-merge.test.js ArcherPreview/tests/v03-bench.test.js ArcherPreview/tests/mesh-simplify.test.js ArcherPreview/tests/frame-rate-settings.test.js ArcherPreview/tests/recording-seconds.test.js ArcherPreview/tests/village-demand-slicing.test.js ArcherPreview/tests/animation-cache-budget.test.js ArcherPreview/tests/v03-typewriter.test.js ArcherPreview/tests/v03-cast-life.test.js ArcherPreview/tests/v03-i18n-runtime-labels.test.js ArcherPreview/tests/v03-actor-material-freeze.test.js ArcherPreview/tests/boss-align-first-frame.test.js ArcherPreview/tests/v03-actor-shadow-casters.test.js ArcherPreview/tests/v03-interact-button.test.js ArcherPreview/tests/fixed-layouts.test.js ArcherPreview/tests/runtime-module-graph.test.js
      - name: Report the shipped layout chunks
        run: |
          for d in ArcherPreview/dist/moonforest-0.3 ArcherPreview/dist/moonforest-0.2; do
            echo "== $d"; find "$d" -name '*.js' -printf '%s %p\n' | sort -n | tail -8
            echo "-- chunks holding prebuilt placements"; grep -l 'home-01' -r "$d" --include='*.js' | while read f; do echo "$(stat -c %s "$f") $(gzip -9c "$f" | wc -c) $f"; done
            echo "-- browser fallback present"; grep -l 'was read before it was prepared' -r "$d" --include='*.js' || echo none
          done
