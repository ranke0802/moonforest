name: Deploy reviewed game build
on:
  push:
    branches: [MoonForest, archer]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without asset preparation
        run: npm ci --prefix ArcherPreview --ignore-scripts --no-audit --no-fund
      - name: Verify source and release contracts without repacking assets
        run: node --test --test-concurrency=2 ArcherPreview/tests/release-route.test.js ArcherPreview/tests/v03-save-slots.test.js ArcherPreview/tests/v03-shell.test.js ArcherPreview/tests/v03-i18n.test.js ArcherPreview/tests/chapter-quest.test.js ArcherPreview/tests/progress-save-recovery.test.js ArcherPreview/tests/gold-loot.test.js ArcherPreview/tests/context-recovery.test.js ArcherPreview/tests/source-provenance.test.js ArcherPreview/tests/release-deployment.test.js ArcherPreview/tests/stage-pages.test.js ArcherPreview/tests/navigation-search-workspace.test.js ArcherPreview/tests/village-texture-demand-cache.test.js ArcherPreview/tests/map-shader-budget.test.js ArcherPreview/tests/actor-camera-culling.test.js ArcherPreview/tests/frame-work-coordinator.test.js
      - uses: actions/configure-pages@v5
      - name: Verify and stage the published resource graph
        run: node ArcherPreview/scripts/stage-pages.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
